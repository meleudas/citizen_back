name: Звіт про баг
description: Повідомити про помилку в API
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Опис проблеми
      description: Що сталося і що очікувалось?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Кроки для відтворення
      placeholder: |
        1. Виконати POST /api/auth/login
        2. ...
        3. Побачити помилку 500
    validations:
      required: true

  - type: input
    id: endpoint
    attributes:
      label: Ендпоінт
      placeholder: POST /api/violations

  - type: dropdown
    id: environment
    attributes:
      label: Середовище
      options:
        - Локальна розробка
        - Docker
        - Production
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Логи / відповідь сервера
      render: shell
