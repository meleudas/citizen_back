# docker-compose.yml (для розробки з MongoDB Atlas)

version: '3.8'

services:
  # Redis (локально)
  redis:
    image: redis:7-alpine
    container_name: violations-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: violations-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      # MongoDB Atlas підключається через .env
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - app-network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis-data:
    driver: local

networks:
  app-network:
    driver: bridge

# Команди:
# Запуск: docker-compose up -d
# Зупинка: docker-compose down
# Логи: docker-compose logs -f